
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09060f">
<title>LEGIT PANELS | Dashboard</title>

<style>
*{box-sizing:border-box}

:root{
  --purple:#a855f7;
  --grape:#7025b8;
  --white:#fff;
  --bg:#09060f;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

body:before,body:after{
  content:"";
  position:fixed;
  width:390px;
  height:390px;
  border-radius:50%;
  filter:blur(85px);
  pointer-events:none;
  z-index:-1;
}

body:before{
  background:#8526c755;
  top:5%;
  left:-190px;
  animation:liquid 12s ease-in-out infinite alternate;
}

body:after{
  background:#a855f744;
  right:-190px;
  bottom:0;
  animation:liquid 14s ease-in-out infinite alternate-reverse;
}

@keyframes liquid{
  to{transform:translate(100px,120px) scale(1.35)}
}

/* HEADER */

header{
  height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#100b18cc;
  backdrop-filter:blur(20px);
  border-bottom:1px solid #a855f733;
}

.logo{
  font-size:21px;
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:0 0 15px #a855f7;
}

.menu{
  font-size:25px;
  cursor:pointer;
  color:#d9b5ff;
}

/* MAIN */

main{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:20px;
}

/* DIAGONAL GLITCH TEXT */

.brand-wrap{
  margin:45px 0 38px;
  text-align:center;
  overflow:hidden;
}

.brand{
  position:relative;
  display:inline-block;
  font-size:clamp(29px,8vw,43px);
  font-weight:1000;
  letter-spacing:-1.5px;
  line-height:1.2;
  white-space:nowrap;
  color:transparent;
  -webkit-text-fill-color:transparent;
  background:linear-gradient(
    155deg,
    #fff 0%,
    #fff 49.5%,
    #a855f7 50.5%,
    #7025b8 100%
  );
  background-clip:text;
  -webkit-background-clip:text;
  filter:drop-shadow(0 0 9px #a855f766);
  animation:glitchSwap 10s infinite;
}

.brand:before,
.brand:after{
  content:attr(data-text);
  position:absolute;
  inset:0;
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  pointer-events:none;
}

.brand:before{
  background:linear-gradient(
    155deg,
    #a855f7 0%,
    #7025b8 49.5%,
    #fff 50.5%,
    #fff 100%
  );
  opacity:0;
  animation:glitchLayer 10s infinite;
}

.brand:after{
  background:linear-gradient(
    155deg,
    #fff 0%,
    #fff 49.5%,
    #a855f7 50.5%,
    #7025b8 100%
  );
  opacity:0;
  animation:glitchFlicker 10s infinite;
}

@keyframes glitchSwap{
  0%,94%,100%{
    transform:translateX(0);
  }
  95%{transform:translateX(-4px) skewX(-5deg)}
  96%{transform:translateX(5px) skewX(5deg)}
  97%{transform:translateX(-2px)}
  98%{transform:translateX(2px)}
}

@keyframes glitchLayer{
  0%,47%,48%,100%{opacity:0}
  49%{opacity:1;transform:translateX(-4px)}
  50%{opacity:1;transform:translateX(4px)}
  51%,95%{opacity:0}
  96%{opacity:1;transform:translateX(-3px)}
  97%{opacity:1;transform:translateX(3px)}
  98%{opacity:0}
}

@keyframes glitchFlicker{
  0%,47%,51%,95%,98%,100%{opacity:0}
  49%,50%,96%,97%{opacity:.8}
}

.subtitle{
  margin-top:12px;
  color:#a895b7;
  font-size:10px;
  letter-spacing:4px;
}

/* DASHBOARD CARDS */

.card{
  background:linear-gradient(145deg,#21152ddd,#100b18ee);
  border:1px solid #a855f755;
  border-radius:17px;
  padding:22px;
  margin-bottom:17px;
  box-shadow:0 0 25px #8b35c422;
  position:relative;
  overflow:hidden;
}

.card:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  top:-100px;
  right:-70px;
  background:#a855f722;
  filter:blur(30px);
}

.card-label{
  color:#c99aff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}

.card-value{
  margin-top:15px;
  font-size:34px;
  font-weight:1000;
  color:white;
  text-shadow:0 0 12px #ffffff55;
}

.card-icon{
  float:right;
  font-size:23px;
  color:#c084fc;
}

/* BUTTONS */

.action{
  width:100%;
  padding:17px;
  margin-top:12px;
  border:1px solid #d7b2ff;
  border-radius:5px;
  font-size:13px;
  font-weight:1000;
  letter-spacing:1.5px;
  cursor:pointer;
  transition:.25s;
  clip-path:polygon(0 0,100% 0,96% 100%,0 100%);
}

.history{
  background:linear-gradient(110deg,#35104f,#8428d4);
  color:white;
  box-shadow:0 0 18px #a855f755;
}

.buy{
  background:linear-gradient(
    110deg,
    white 0%,
    white 49%,
    #a855f7 50%,
    #7025b8 100%
  );
  color:#220b36;
}

.action:active{
  transform:scale(.97);
}

footer{
  text-align:center;
  padding:35px 10px;
  color:#806b90;
  font-size:10px;
  letter-spacing:2px;
}

@media(max-width:360px){
  main{padding:15px}
  .brand{font-size:28px}
}
</style>
</head>

<body>

<header>
  <div class="logo">LEGIT PANELS</div>
  <div class="menu" onclick="location.href='login.html'">☰</div>
</header>

<main>

  <section class="brand-wrap">
    <div class="brand" data-text="LEGIT PANELS">
      LEGIT PANELS
    </div>
    <div class="subtitle">PREMIUM DIGITAL ACCESS</div>
  </section>

  <section class="card">
    <span class="card-icon">◈</span>
    <div class="card-label">WALLET BALANCE</div>
    <div class="card-value" id="wallet">₹0.00</div>
  </section>

  <section class="card">
    <span class="card-icon">⌘</span>
    <div class="card-label">KEYS BOUGHT</div>
    <div class="card-value" id="keysBought">0</div>
  </section>

  <button class="action history"
    onclick="location.href='history.html'">
    PURCHASE HISTORY →
  </button>

  <button class="action buy"
    onclick="location.href='products.html'">
    BUY KEYS →
  </button>

</main>

<footer>
  LEGIT PANELS © 2026
</footer>

<!-- Firebase customer dashboard connection -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_EXISTING_FIREBASE_API_KEY",
  authDomain: "legit-panels.firebaseapp.com",
  projectId: "legit-panels",
  storageBucket: "legit-panels.firebasestorage.app",
  messagingSenderId: "794565207727",
  appId: "1:794565207727:web:0a179fb0495be1fe7dd65a"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  try {
    const snapshot = await db.collection("purchases")
      .where("uid", "==", user.uid)
      .get();

    document.getElementById("keysBought").textContent =
      snapshot.size;
  } catch (error) {
    console.error("Purchase count error:", error);
  }
});
</script>

</body>
</html>
