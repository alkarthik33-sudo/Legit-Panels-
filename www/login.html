
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGIT PANELS - Login</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:grid;
 place-items:center;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
}
.card{
 width:90%;
 max-width:380px;
 padding:28px;
 background:#111;
 border:1px solid #e00020;
 border-radius:15px;
 box-shadow:0 0 20px #e0002033;
}
h1{text-align:center;color:#ff1838}
input,button{
 width:100%;
 padding:14px;
 margin-top:14px;
 border-radius:8px;
}
input{
 background:#080808;
 color:white;
 border:1px solid #444;
}
button{
 background:#e00020;
 color:white;
 border:0;
 font-weight:bold;
}
p{text-align:center;color:#aaa}
a{color:#ff4058}
</style>
</head>
<body>
<div class="card">
<h1>LEGIT PANELS</h1>
<h3>Customer Login</h3>
<input type="email" placeholder="Email address">
<input type="password" placeholder="Password">
<button>LOGIN</button>
<p>New customer? <a href="signup.html">Create account</a></p>
</div>
</body>
</html>
