<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090610">
<title>LEGIT PANELS | Signup</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;
 place-items:center;overflow:hidden;
 background:#090610;color:white;
 font-family:Arial,sans-serif;
}
.chrome{
 position:fixed;inset:-40%;
 background:
 radial-gradient(ellipse at 30% 40%,#a65cff 0%,transparent 24%),
 radial-gradient(ellipse at 65% 35%,#512080 0%,transparent 27%),
 radial-gradient(ellipse at 55% 75%,#b9a0d5 0%,transparent 15%),
 radial-gradient(ellipse at 75% 65%,#34104f 0%,transparent 25%),
 #090610;
 filter:blur(45px) contrast(1.35);
 animation:liquid 13s ease-in-out infinite alternate;
 z-index:-2;
}
.chrome:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(125deg,
 transparent 30%,#ffffff35 45%,
 transparent 52%,#a85cff55 65%,transparent 75%);
 mix-blend-mode:screen;
 animation:shine 8s linear infinite;
}
@keyframes liquid{
 0%{transform:translate(-5%,0) rotate(0deg) scale(1)}
 50%{transform:translate(4%,5%) rotate(12deg) scale(1.15)}
 100%{transform:translate(-2%,-5%) rotate(-10deg) scale(1.08)}
}
@keyframes shine{
 0%{transform:translateX(-35%) rotate(0deg)}
 100%{transform:translateX(35%) rotate(360deg)}
}
.card{
 width:90%;max-width:380px;padding:30px;
 background:#100d18cc;
 backdrop-filter:blur(22px);
 border:1px solid #b98aff66;
 border-radius:20px;
 box-shadow:0 0 45px #9b4dff25;
}
h1{text-align:center;letter-spacing:3px}
h1 span{color:#bd8aff}
input,button{
 width:100%;padding:15px;margin-top:15px;
 border-radius:10px;font-size:14px;
}
input{
 background:#080610;color:white;
 border:1px solid #6c4b87;
 outline:none;
}
input:focus{border-color:#c29aff;box-shadow:0 0 12px #9b4dff55}
button{
 background:linear-gradient(110deg,#7136a8,#b17aff);
 color:white;border:0;font-weight:bold;
 cursor:pointer;
}
p{text-align:center;color:#aaa;font-size:13px}
a{color:#c79aff}
#message{min-height:18px}
</style>
</head>

<body>
<div class="chrome"></div>

<div class="card">

<h1>LEGIT <span>PANELS</span></h1>
<h3>Customer Signup</h3>

<input id="name" type="text" placeholder="Full name" maxlength="60">

<input id="email" type="email" placeholder="Email address">

<input id="password" type="password" placeholder="Create password">

<input id="confirm" type="password" placeholder="Confirm password">

<button id="signup">CREATE ACCOUNT</button>

<p id="message"></p>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyBjtH-H8FtOFCzgoD1NxdLIv3ZGriO9w9E",
 authDomain: "legit-panels.firebaseapp.com",
 projectId: "legit-panels",
 storageBucket: "legit-panels.firebasestorage.app",
 messagingSenderId: "794565207727",
 appId: "1:794565207727:web:0a179fb0495be1fe7dd65a",
 measurementId: "G-KQJ59QXW75"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const msg=document.getElementById("message");
const btn=document.getElementById("signup");

btn.onclick=async()=>{

 const name=document.getElementById("name").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;

 if(!name||!email||!password||!confirm){
  msg.style.color="#ff6464";
  msg.textContent="Please fill all fields.";
  return;
 }

 if(password.length<6){
  msg.style.color="#ff6464";
  msg.textContent="Password must be at least 6 characters.";
  return;
 }

 if(password!==confirm){
  msg.style.color="#ff6464";
  msg.textContent="Passwords do not match.";
  return;
 }

 btn.disabled=true;
 btn.textContent="CREATING ACCOUNT...";

 try{

  const result=await auth.createUserWithEmailAndPassword(
   email,password
  );

  await result.user.updateProfile({
   displayName:name
  });

  msg.style.color="#55ee91";
  msg.textContent="Account created successfully!";

  setTimeout(()=>{
   location.href="index.html";
  },1000);

 }catch(error){

  msg.style.color="#ff6464";
  msg.textContent=error.message;

  btn.disabled=false;
  btn.textContent="CREATE ACCOUNT";

 }

};
</script>

</body>
</html>
