
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGIT PANELS ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#111;border-bottom:1px solid #e22;color:#ff3945;font-size:22px;font-weight:bold}
main{max-width:850px;margin:auto;padding:20px}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:18px;margin:16px 0}
h2{font-size:20px}
input{display:block;width:100%;padding:14px;margin:10px 0;background:#090909;color:white;border:1px solid #444;border-radius:8px;font-size:15px}
button{background:#ed2733;color:white;border:0;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer}
.full{width:100%;margin-top:10px}
.secondary{background:#292929}
.delete{background:#a51e28;padding:8px}
.item{padding:13px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:#999;font-size:13px}
#dashboard{display:none}
#status{color:#ff7777;font-size:13px}
</style>
</head>
<body>
<header>LEGIT PANELS <small style="font-size:12px;color:#aaa">ADMIN</small></header>

<main>
<section id="login" class="card">
<h2>Admin Login</h2>
<p class="muted">Sign in with your registered administrator account.</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="full" onclick="login()">LOGIN</button>
<p id="loginStatus"></p>
</section>

<section id="dashboard">
<h2>Dashboard</h2>
<p class="muted">Firebase connected admin panel</p>

<div class="card">
<h2>Product Management</h2>
<input id="productName" placeholder="Product name">
<input id="productPrice" type="number" min="0" step="0.01" placeholder="Price in ₹">
<button class="full" onclick="addProduct()">ADD PRODUCT</button>
<p id="productStatus" class="muted"></p>
</div>

<div class="card">
<h2>Products</h2>
<p class="muted">Live products stored in Firestore</p>
<div id="products">Loading products...</div>
</div>

<button class="full secondary" onclick="logout()">LOG OUT</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBjtH-H8FtOFCzgoD1NxdLIv3ZGriO9w9E",
  authDomain: "legit-panels.firebaseapp.com",
  projectId: "legit-panels",
  storageBucket: "legit-panels.firebasestorage.app",
  messagingSenderId: "794565207727",
  appId: "1:794565207727:web:0a179fb0495be1fe7dd65a",
  measurementId: "G-KQJ59QXW75"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let stopProducts = null;

function showMessage(id,message){
 document.getElementById(id).textContent=message;
}

function login(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;

 showMessage('loginStatus','Signing in...');

 auth.signInWithEmailAndPassword(email,password)
 .catch(error=>showMessage('loginStatus',error.message));
}

function logout(){
 auth.signOut();
}

auth.onAuthStateChanged(user=>{
 if(stopProducts){
  stopProducts();
  stopProducts=null;
 }

 if(user){
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  loadProducts();
 }else{
  document.getElementById('login').style.display='block';
  document.getElementById('dashboard').style.display='none';
 }
});

function loadProducts(){
 stopProducts=db.collection('products')
 .orderBy('createdAt','desc')
 .onSnapshot(snapshot=>{
  const container=document.getElementById('products');
  container.replaceChildren();

  if(snapshot.empty){
   container.textContent='No products added yet.';
   return;
  }

  snapshot.forEach(doc=>{
   const data=doc.data();

   const item=document.createElement('div');
   item.className='item';

   const details=document.createElement('span');
   details.textContent=data.name+' — ₹'+data.price;

   const button=document.createElement('button');
   button.className='delete';
   button.textContent='DELETE';
   button.onclick=()=>deleteProduct(doc.id);

   item.append(details,button);
   container.appendChild(item);
  });
 },error=>{
  showMessage('productStatus',error.message);
 });
}

async function addProduct(){
 const name=document.getElementById('productName').value.trim();
 const price=Number(document.getElementById('productPrice').value);

 if(!name || !Number.isFinite(price) || price<0){
  showMessage('productStatus','Enter a valid name and price.');
  return;
 }

 try{
  await db.collection('products').add({
   name:name,
   price:price,
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById('productName').value='';
  document.getElementById('productPrice').value='';
  showMessage('productStatus','Product added successfully!');
 }catch(error){
  showMessage('productStatus',error.message);
 }
}

async function deleteProduct(id){
 if(!confirm('Delete this product?'))return;

 try{
  await db.collection('products').doc(id).delete();
 }catch(error){
  showMessage('productStatus',error.message);
 }
}
</script>
</body>
</html>
